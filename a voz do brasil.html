<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Programação Diária</title>
</head>
<body>
    <header>
        <h1>Verificando conteúdo do dia...</h1>
    </header>

    <script>
        window.onload = function() {
            const agora = new Date();
            
            // Formata a data como DD/MM (exemplo: 12/01)
            const dia = String(agora.getDate()).padStart(2, '0');
            const mes = String(agora.getMonth() + 1).padStart(2, '0');
            const dataHoje = dia + "/" + mes;

            // LISTA DE REDIRECIONAMENTOS
            // Você pode adicionar todos os dias do ano aqui
            const linksPorData = {
                "A Voz do Brasil 16/01/2026 21 Horas": "https://audios.ebc.com.br/radiogov/2026/01/16-01-26-a-voz-do-brasil.mp3",
                "A Voz do Brasil 17/01/2026 Reprise dia 16": "https://audios.ebc.com.br/radiogov/2026/01/19-01-26-a-voz-do-brasil.mp3",
                "18/01": "https://audios.ebc.com.br/radiogov/2026/01/16-01-26-a-voz-do-brasil.mp3",
                "A Voz do Brasil 19/01/2026 21 Horas": "https://audios.ebc.com.br/radiogov/2026/01/19-01-26-a-voz-do-brasil.mp3",
                "A Voz do Brasil 20/01/2026 21 Horas": "https://audios.ebc.com.br/radiogov/2026/01/20-01-26-a-voz-do-brasil.mp3",
                "A Voz do Brasil 21/01/2026 21 Horas": "https://audios.ebc.com.br/radiogov/2026/01/21-01-26-a-voz-do-brasil.mp3",
                "A Voz do Brasil 22/01/2026 21 Horas": "https://audios.ebc.com.br/radiogov/2026/01/22-01-26-a-voz-do-brasil.mp3",
                "A Voz do Brasil 23/01/2026 21 Horas": "https://audios.ebc.com.br/radiogov/2026/01/23-01-26-a-voz-do-brasil.mp3"
                // Adicione quantos dias quiser seguindo o padrão "DD/MM": "link",
            };

            // Verifica se a data de hoje está na lista
            if (linksPorData[dataHoje]) {
                window.location.href = linksPorData[dataHoje];
            } else {
                // Mensagem caso o dia atual não tenha um link cadastrado
                document.body.innerHTML = `
                    <div style="text-align:center; margin-top:50px; font-family: sans-serif;">
                        <h1>Conteúdo Indisponível</h1>
                        <p>Não encontramos uma programação específica para hoje (${dataHoje}).</p>
                    </div>
                `;
            }
        };
    </script>
</body>
</html>
