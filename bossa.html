<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RBA | Soberania Digital</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; }
        .container {
            background-color: #000; 
            color: #fff; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            height: 100vh; 
            display: flex; 
            flex-direction: column; 
            justify-content: center; 
            align-items: center; 
            text-align: center; 
            padding: 40px; 
            border-top: 10px solid #f1c40f;
        }
        .logo { width: 120px; margin-bottom: 30px; filter: grayscale(100%); opacity: 0.8; }
        .title { 
            font-size: 26px; 
            letter-spacing: 3px; 
            color: #f1c40f; 
            margin-bottom: 25px; 
            text-transform: uppercase;
            font-weight: 300;
        }
        .quote-box { 
            max-width: 650px; 
            border-left: 4px solid #f1c40f; 
            padding-left: 25px; 
            margin-bottom: 35px;
            background: rgba(241, 196, 15, 0.05);
            padding: 20px 25px;
        }
        .quote-text { 
            font-size: 19px; 
            line-height: 1.7; 
            text-align: left; 
            font-style: italic;
            color: #fdfbf7;
            margin: 0;
        }
        .concept { 
            font-size: 15px; 
            margin-bottom: 45px; 
            color: #aaa; 
            letter-spacing: 1px;
        }
        .btn-free { 
            background-color: #f1c40f; 
            color: #000; 
            padding: 18px 35px; 
            text-decoration: none; 
            font-weight: bold; 
            border-radius: 2px; 
            text-transform: uppercase;
            transition: 0.3s;
            letter-spacing: 1px;
        }
        .btn-free:hover { background-color: #fff; transform: scale(1.02); }
        .footer-note { 
            margin-top: 70px; 
            font-size: 10px; 
            opacity: 0.4; 
            letter-spacing: 6px; 
            text-transform: uppercase;
        }
        body, html { 
    margin: 0; 
    padding: 0; 
    width: 100%; 
    min-height: 100vh; /* Mudança aqui: de height para min-height */
    overflow-x: hidden; /* Trava apenas a lateral */
    background-color: #000;
}

.container {
    background-color: #000;

    flex-direction: column;

    align-items: center;

    padding: 60px 20px; /* Mais espaço para o respiro */

}
    </style>
</head>
<body>

<div style="
    background-color: #f8f4dc; 
    color: #2c3e50; 
    min-height: 100vh; 
    display: flex; 
    justify-content: center; 
    align-items: center; 
    padding: 20px;
    font-family: 'Georgia', serif;">

    <div style="
        width: 100%; 
        max-width: 500px; 
        background: #f8f4dc; 
        border: 1px solid rgba(184, 134, 11, 0.2); 
        padding: 50px; 
        text-align: center;
        box-shadow: 0 4px 15px rgba(0,0,0,0.05);">
       
        <p style="font-size: 18px; line-height: 1.8; color: #4a4a4a; margin-bottom: 0;">
            "Nós da IARTIUM, por nossa decisão estratégica e alinhamento aos critérios de <strong>ESG</strong> e <strong>ONU</strong>, nossa arte agora habita apenas o campo aberto. Não aceitamos cercas." 
            "Estaremos somente no <strong>Android</strong>, por este estar alinhado com nossa missão e inclusão."
        </p>
       
        <p style="font-size: 10px; opacity: 0.7; letter-spacing: 4px; text-transform: uppercase; color: #b8860b;">

        </p>

</div>
