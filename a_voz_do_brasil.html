<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Playlist RBA</title>
    <style>
        /* Interface Clean da RBA */
        body { background: transparent; font-family: -apple-system, sans-serif; color: #084424; margin: 0; padding: 0; }
        #lista { display: flex; flex-direction: column; width: 100%; }
        
        .item { 
            padding: 16px 15px; 
            border-bottom: 1px solid rgba(8, 68, 36, 0.08); 
            cursor: pointer; 
            font-size: 16px; 
            font-weight: 400;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: all 0.2s ease;
            -webkit-tap-highlight-color: transparent;
        }

        .item.active { 
            background-color: rgba(8, 68, 36, 0.05); 
            font-weight: 700;
            color: #084424;
            border-left: 4px solid #084424;
        }

        .item::after { content: "▶"; font-size: 10px; opacity: 0.3; margin-left: 10px; }
        .item.active::after { content: "🔊"; opacity: 1; font-size: 12px; }
        .item:active { background-color: rgba(8, 68, 36, 0.1); }
        
        .item span { 
            white-space: nowrap; 
            overflow: hidden; 
            text-overflow: ellipsis; 
            flex: 1;
        }
    </style>
</head>
<body> 
    <div id="lista"></div>

    <script>
        // 1. Definição da Programação Diária (O que muda todo dia)
        const agora = new Date();
        const dia = String(agora.getDate()).padStart(2, '0');
        const mes = String(agora.getMonth() + 1).padStart(2, '0');
        const dataHoje = `${dia}/${mes}`;

        const linksDiarios = {
            "16/01": { url: "https://audios.ebc.com.br/radiogov/2026/01/16-01-26-a-voz-do-brasil.mp3", nome: "A Voz do Brasil 16/01/2026" },
            "17/01": { url: "https://audios.ebc.com.br/radiogov/2026/01/19-01-26-a-voz-do-brasil.mp3", nome: "A Voz do Brasil - Reprise" },
            "18/01": { url: "https://audios.ebc.com.br/radiogov/2026/01/16-01-26-a-voz-do-brasil.mp3", nome: "A Voz do Brasil - Especial" },
            "19/01": { url: "https://audios.ebc.com.br/radiogov/2026/01/19-01-26-a-voz-do-brasil.mp3", nome: "A Voz do Brasil 19/01/2026" }
            // Adicione os outros dias aqui...
        };

        // 2. Playlist Fixa (O que sempre aparece)
        let tracks = [
            { url: "https://audios.ebc.com.br/radiogov/2026/01/14-01-26-a-voz-do-brasil.mp3", nome: "A Voz do Brasil 14/01/2026" },
            { url: "https://audios.ebc.com.br/radiogov/2026/01/15-01-26-a-voz-do-brasil.mp3", nome: "A Voz do Brasil 15/01/2026" }
        ];

        // 3. Lógica de Redirecionamento Silencioso:
        // Se existir algo para hoje, coloca no topo da lista
        if (linksDiarios[dataHoje]) {
            tracks.unshift(linksDiarios[dataHoje]); 
        }

        let indiceAtual = 0;

        // 4. Renderização da Interface
        const listaDiv = document.getElementById('lista');
        function renderizarLista() {
            listaDiv.innerHTML = '';
            tracks.forEach((track, i) => {
                const div = document.createElement('div');
                div.className = i === indiceAtual ? 'item active' : 'item';
                div.id = 'track-' + i;
                div.onclick = () => selecionar(i);
                div.innerHTML = `<span>${track.nome}</span>`;
                listaDiv.appendChild(div);
            });
        }

        function selecionar(index) {
            indiceAtual = index;
            renderizarLista();
            enviarParaOApp();
        }

        function enviarParaOApp() {
            const musica = tracks[indiceAtual];
            if (window.parent) {
                window.parent.postMessage({
                    tipo: 'tocar',
                    url: musica.url,
                    nome: musica.nome
                }, '*');
            }
        }

        // Responde ao player principal (Next/Prev)
        window.addEventListener('message', function(event) {
            if (event.data === 'next') {
                selecionar((indiceAtual + 1) % tracks.length);
            } else if (event.data === 'prev') {
                selecionar((indiceAtual - 1 + tracks.length) % tracks.length);
            }
        });

        // Inicialização
        renderizarLista();
        enviarParaOApp(); // Já começa tocando o item do dia

        // Service Worker
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js');
        }
    </script>
 <script>
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js');
    }
</script>
</body>
</html>
