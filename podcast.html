<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <style>
        body { background: transparent; font-family: -apple-system, sans-serif; color: #084424; margin: 0; padding: 0; }
        #lista { display: flex; flex-direction: column; width: 100%; }
        .item { 
            padding: 18px 15px; 
            border-bottom: 1px solid rgba(8, 68, 36, 0.1); 
            cursor: pointer; 
            font-size: 17px; 
            font-weight: 500;
            display: flex;
            align-items: center;
            justify-content: space-between;
            -webkit-tap-highlight-color: transparent;
        }
        .item::after { content: "▶"; font-size: 12px; opacity: 0.3; }
        .item:active { background-color: rgba(8, 68, 36, 0.1); }
        .item span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 90%; }
    </style>
</head>
<body>
    <div id="lista">
        <div class="item" onclick="selecionar(0)"><span>Saúde Mental</span></div>
        <div class="item" onclick="selecionar(1)"><span>Ansiedade</span></div>
        <div class="item" onclick="selecionar(2)"><span>Comportamento</span></div>
        <div class="item" onclick="selecionar(3)"><span>Aposentadoria INSS</span></div>
        <div class="item" onclick="selecionar(4)"><span>Ondas de Calor</span></div>
        <div class="item" onclick="selecionar(5)"><span>Embrapa tem papel essencial</span></div>
        <div class="item" onclick="selecionar(6)"><span>Hidrogênio Verde</span></div>
        <div class="item" onclick="selecionar(7)"><span>No Brasil Império</span></div>
        <div class="item" onclick="selecionar(8)"><span>Riscos do cigarro eletrônico</span></div>
    </div>

    <script>
        const tracks = [
            { url: "https://traffic.megaphone.fm/GLT3446402672.mp3", nome: "Dra Alana" },
            { url: "https://traffic.megaphone.fm/GLT5670835570.mp3", nome: "Dra Alana" },
            { url: "https://traffic.megaphone.fm/GLT2505292577.mp3", nome: "Dra Alana" },
            { url: "https://ia601300.us.archive.org/33/items/sarah_202601/sarah.mp3", nome: "Dra Sarah Amélia" },
            { url: "https://www12.senado.leg.br/audio/dae61be5-c889-474a-8386-1cdbd5d40d7e.mp3", nome: "Cuidados com a Saúde" },
            { url: "https://www12.senado.leg.br/audio/3803195b-d8cb-487c-bf30-eb2d2de8b3f1.mp3", nome: "na produção sustentável de alimentos" },
            { url: "https://www12.senado.leg.br/audio/8b09c4c0-696e-4e96-84b8-7a049b8b6d41.mp3", nome: "Brasil como potência do hidrogênio verde" },
            { url: "https://www12.senado.leg.br/audio/638b5cb5-26ba-4abe-8b51-1372aa87a1a7.mp3", nome: "planos para substituir escravos negros por chineses" },
            { url: "https://audios.ebc.com.br/radiogov/2025/07/15-07-2025-papo-sau-de-prev-quedas.mp3", nome: "Evitar Acidentes" },
            { url: "https://audios.ebc.com.br/radiogov/2024/06/06-06-24-podcast-papo-saude-episodio-dia-mundial-do-tabaco-1-21m09s.mp3", nome: "Riscos do cigarro eletrônico" }
        ];

        let indiceAtual = 0;

        function selecionar(index) {
            indiceAtual = index;
            enviarParaOApp();
        }

        function enviarParaOApp() {
            const musica = tracks[indiceAtual];
            if (window.parent) {
                window.parent.postMessage({
                    tipo: 'tocar',
                    url: musica.url,
                    nome: musica.nome
                }, '*');
            }
        }

        // Responde aos botões do App Principal
        window.addEventListener('message', function(event) {
            if (event.data === 'next') {
                indiceAtual = (indiceAtual + 1) % tracks.length;
                enviarParaOApp();
            } else if (event.data === 'prev') {
                indiceAtual = (indiceAtual - 1 + tracks.length) % tracks.length;
                enviarParaOApp();
            }
        });
    </script>
</body>
</html>
