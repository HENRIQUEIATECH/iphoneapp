<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <style>
        body { background: transparent; font-family: -apple-system, sans-serif; color: #084424; margin: 0; padding: 0; }
        #lista { display: flex; flex-direction: column; width: 100%; }
        
        .item { 
            padding: 16px 15px; 
            border-bottom: 1px solid rgba(8, 68, 36, 0.08); 
            cursor: pointer; 
            font-size: 16px; 
            font-weight: 400;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: all 0.2s ease;
            -webkit-tap-highlight-color: transparent;
        }

        /* Estilo para a música que está tocando */
        .item.active { 
            background-color: rgba(8, 68, 36, 0.05); 
            font-weight: 700;
            color: #084424;
            border-left: 4px solid #084424;
        }

        .item::after { content: "▶"; font-size: 10px; opacity: 0.3; margin-left: 10px; }
        .item.active::after { content: "🔊"; opacity: 1; font-size: 12px; }
        
        .item:active { background-color: rgba(8, 68, 36, 0.1); }
        
        .item span { 
            white-space: nowrap; 
            overflow: hidden; 
            text-overflow: ellipsis; 
            flex: 1;
        }
    </style>
</head>
<body> 
    <div id="lista">
        </div>

    <script>
        const tracks = [
            { url: "https://traffic.megaphone.fm/GLT3446402672.mp3", nome: "Dra Alana - Saúde Mental" },
            { url: "https://traffic.megaphone.fm/GLT5670835570.mp3", nome: "Dra Alana - Ansiedade" },
            { url: "https://traffic.megaphone.fm/GLT2505292577.mp3", nome: "Dra Alana - Comportamento" },
            { url: "https://ia601300.us.archive.org/33/items/sarah_202601/sarah.mp3", nome: "Dra Sarah Amélia - Aposentadoria INSS" },
            { url: "https://audios.ebc.com.br/radiogov/2025/07/15-07-2025-papo-sau-de-prev-quedas.mp3", nome: "Evitar Acidentes" },
            { url: "https://audios.ebc.com.br/radiogov/2024/06/06-06-24-podcast-papo-saude-episodio-dia-mundial-do-tabaco-1-21m09s.mp3", nome: "Riscos do cigarro eletrônico" },
            { url: "https://audios.ebc.com.br/radiogov/2025/10/papo-sau-de-mental-corte-social.mp3", nome: "Saúde mental é coletiva: o impacto das desigualdades no sofrimento psíquico" },
            { url: "https://audios.ebc.com.br/radiogov/2025/06/03-06-2025-sus-03-v2-aprovado.mp3", nome: "SUS 35 anos: conquistas e desafios" },
            { url: "https://audios.ebc.com.br/radiogov/2025/05/22-05-2025-papo-saude-mais-medicos.mp3", nome: "Mais médicos para todo o Brasil, de canto a canto" },
            { url: "https://audios.ebc.com.br/radiogov/2025/05/20-05-2025-papo-saude-doenca-de-chagas.mp3", nome: "Chagas, a doença silenciosa" },
            { url: "https://audios.ebc.com.br/radiogov/2025/04/pgm-01-sus-35-anos.mp3", nome: "SUS 35 ANOS: como chegamos até aqui" },
            { url: "https://audios.ebc.com.br/radiogov/2025/02/27-02-2025-papo-saude-dengue.mp3", nome: "Dengue: Ministério da Saúde e a população juntos no combate" },
            { url: "https://audios.ebc.com.br/radiogov/2025/02/12-02-2025-papo-saude-hanseniase-1.mp3", nome: "Hanseníase: qual é o tratamento de uma das doenças mais antigas da humanidade?" },
            { url: "https://audios.ebc.com.br/radiogov/2025/01/10-01-2025-papo-saude-emergencias-de-fim-de-ano.mp3", nome: "As principais emergências das férias e como evitá-las" },
            { url: "https://audios.ebc.com.br/radiogov/2024/12/05-12-2024-podcast-papo-saude-saude-do-homem.mp3", nome: "Saúde do Homem: além do combate ao câncer de próstata" },
            { url: "https://audios.ebc.com.br/radiogov/2024/11/04-11-2024-papo-saude-vacinacao-e-desinformacao.mp3", nome: "Vacinação: como a desinformação pode impactar a imunização" },
            { url: "https://audios.ebc.com.br/radiogov/2024/10/23-10-2024-papo-saude-sifilis.mp3", nome: "Sífilis e Sífilis Congênita: como evitar e quais as consequências" },
            { url: "https://audios.ebc.com.br/radiogov/2024/10/18-102-2024-papo-saude-animais-peconhentos.mp3", nome: "Animais peçonhentos: saiba como agir em caso de emergência" },
            { url: "https://audios.ebc.com.br/radiogov/2024/10/16-01-2024-papo-saude-outubro-rosa.mp3", nome: "Outubro rosa: diagnóstico precoce é essencial para maior chance de cura" },
            { url: "https://audios.ebc.com.br/radiogov/2024/09/09-09-2024-papo-saude-poliomielite.mp3", nome: "Poliomielite: vacinar para impedir o ressurgimento da doença" },
            { url: "https://audios.ebc.com.br/radiogov/2024/08/19-08-2024-papo-saude-agosto-dourado.mp3", nome: "Amamentação: esclareça as principais dúvidas sobre o tema" },
            { url: "https://audios.ebc.com.br/radiogov/2024/07/09-07-2024-papo-saude-mitos-sobre-o-cuidado-paliativo.mp3", nome: "Cuidados Paliativos: desmistificando os tabus" },
            { url: "https://audios.ebc.com.br/radiogov/2024/03/12-03-2024-papo-saude-saude-integral-da-mulher.mp3", nome: "Saúde Integral da Mulher: saiba seus direitos no SUS" },
            { url: "https://audios.ebc.com.br/radiogov/2024/03/07-03-2024-papo-saude-episodio-dignidade-menstrual.mp3", nome: "Dignidade Menstrual: saiba como retirar absorventes gratuitos" }
        ];

        let indiceAtual = 0;

        // Renderiza a lista automaticamente
        const listaDiv = document.getElementById('lista');
        tracks.forEach((track, i) => {
            const div = document.createElement('div');
            div.className = 'item';
            div.id = 'track-' + i;
            div.onclick = () => selecionar(i);
            div.innerHTML = `<span>${track.nome}</span>`;
            listaDiv.appendChild(div);
        });

        function selecionar(index) {
            indiceAtual = index;
            atualizarInterface();
            enviarParaOApp();
        }

        function atualizarInterface() {
            // Remove a classe active de todos
            document.querySelectorAll('.item').forEach(el => el.classList.remove('active'));
            // Adiciona na música atual
            const elementoAtivo = document.getElementById('track-' + indiceAtual);
            if (elementoAtivo) {
                elementoAtivo.classList.add('active');
                // Faz a lista rolar automaticamente para a música se ela estiver fora da visão
                elementoAtivo.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            }
        }

        function enviarParaOApp() {
            const musica = tracks[indiceAtual];
            if (window.parent) {
                window.parent.postMessage({
                    tipo: 'tocar',
                    url: musica.url,
                    nome: musica.nome
                }, '*');
            }
        }

        // Responde aos botões do App Principal
        window.addEventListener('message', function(event) {
            if (event.data === 'next') {
                indiceAtual = (indiceAtual + 1) % tracks.length;
                selecionar(indiceAtual);
            } else if (event.data === 'prev') {
                indiceAtual = (indiceAtual - 1 + tracks.length) % tracks.length;
                selecionar(indiceAtual);
            }
        });

        // Inicia a primeira música visualmente
        atualizarInterface();
    </script>
        <script>
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js');
    }
</script>
</body>
</html>
