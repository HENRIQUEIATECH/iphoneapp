<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <style>
        body { background: transparent; font-family: -apple-system, sans-serif; color: #084424; margin: 0; padding: 0; }
        #lista { display: flex; flex-direction: column; width: 100%; }
        .item { 
            padding: 18px 15px; 
            border-bottom: 1px solid rgba(8, 68, 36, 0.1); 
            cursor: pointer; 
            font-size: 17px; 
            font-weight: 500;
            display: flex;
            align-items: center;
            justify-content: space-between;
            -webkit-tap-highlight-color: transparent;
        }
        .item::after { content: "▶"; font-size: 12px; opacity: 0.3; }
        .item:active { background-color: rgba(8, 68, 36, 0.1); }
        .item span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 90%; }
    </style>
</head>
<body>
    <div id="lista">
        <div class="item" onclick="selecionar(0)"><span>Francisco Alves</span></div>
        <div class="item" onclick="selecionar(1)"><span>Orlando Silva</span></div>
        <div class="item" onclick="selecionar(2)"><span>Vicente Celessstino</span></div>
        <div class="item" onclick="selecionar(3)"><span>Mário Reis</span></div>
        <div class="item" onclick="selecionar(4)"><span>Carlos Galhardo</span></div>
    </div>

    <script>
        const tracks = [
            { url: "https://dn720300.ca.archive.org/0/items/os-reis-da-voz-2013/Os%20Reis%20Da%20Voz%20%282013%29/01%20-%20Francisco%20Alves%20-%20Boa%20Noite%2C%20Amor.mp3", nome: "Boa Noite, Amor" },
            { url: "https://dn720300.ca.archive.org/0/items/os-reis-da-voz-2013/Os%20Reis%20Da%20Voz%20%282013%29/04%20-%20Orlando%20Silva%20-%20Errei%2C%20Erramos.mp3", nome: "Errei, Erramos" },
            { url: "https://dn720300.ca.archive.org/0/items/os-reis-da-voz-2013/Os%20Reis%20Da%20Voz%20%282013%29/07%20-%20Vicente%20Celestino%20-%20Linda%20Flor%20%28Ai%2C%20Y%C3%B4%20Y%C3%B4%29.mp3", nome: "Linda Flor (Ai, Yô Yô)" },
            { url: "https://dn720300.ca.archive.org/0/items/os-reis-da-voz-2013/Os%20Reis%20Da%20Voz%20%282013%29/02%20-%20M%C3%A1rio%20Reis%20-%20Jura.mp3", nome: "Jura" },
            { url: "https://dn720300.ca.archive.org/0/items/os-reis-da-voz-2013/Os%20Reis%20Da%20Voz%20%282013%29/06%20-%20Carlos%20Galhardo%20-%20Fascina%C3%A7%C3%A3o.mp3", nome: "Fascinação" }
        ];

        let indiceAtual = 0;

        function selecionar(index) {
            indiceAtual = index;
            enviarParaOApp();
        }

        function enviarParaOApp() {
            const musica = tracks[indiceAtual];
            if (window.parent) {
                window.parent.postMessage({
                    tipo: 'tocar',
                    url: musica.url,
                    nome: musica.nome
                }, '*');
            }
        }

        // Responde aos botões do App Principal
        window.addEventListener('message', function(event) {
            if (event.data === 'next') {
                indiceAtual = (indiceAtual + 1) % tracks.length;
                enviarParaOApp();
            } else if (event.data === 'prev') {
                indiceAtual = (indiceAtual - 1 + tracks.length) % tracks.length;
                enviarParaOApp();
            }
        });
    </script>
</body>
</html>
