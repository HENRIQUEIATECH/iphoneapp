<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <style>
        body { background: transparent; font-family: -apple-system, sans-serif; color: #084424; margin: 0; padding: 0; }
        #lista { display: flex; flex-direction: column; width: 100%; }
        
        .item { 
            padding: 16px 15px; 
            border-bottom: 1px solid rgba(8, 68, 36, 0.08); 
            cursor: pointer; 
            font-size: 16px; 
            font-weight: 400;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: all 0.2s ease;
            -webkit-tap-highlight-color: transparent;
        }

        /* Estilo para a música que está tocando */
        .item.active { 
            background-color: rgba(8, 68, 36, 0.05); 
            font-weight: 700;
            color: #084424;
            border-left: 4px solid #084424;
        }

        .item::after { content: "▶"; font-size: 10px; opacity: 0.3; margin-left: 10px; }
        .item.active::after { content: "🔊"; opacity: 1; font-size: 12px; }
        
        .item:active { background-color: rgba(8, 68, 36, 0.1); }
        
        .item span { 
            white-space: nowrap; 
            overflow: hidden; 
            text-overflow: ellipsis; 
            flex: 1;
        }
    </style>
</head>
<body> 
    <div id="lista">
        </div>

            { url: "https://dn720300.ca.archive.org/0/items/os-reis-da-voz-2013/Os%20Reis%20Da%20Voz%20%282013%29/13%20-%20Germano%20Mathias%20-%20Maria%20Espingardina.mp3", nome: "Germano Mathias - Maria Espingardina" },

            { url: "https://dn720903.ca.archive.org/0/items/50anosdeboemiavol1/17.%20Nelson%20Gon%C3%A7alves%20-%20Como%20Vai%20Voc%C3%AA.mp3", nome: "Nelson Gonçalves - Como Vai Você" },
            { url: "https://dn720903.ca.archive.org/0/items/50anosdeboemiavol1/18.%20Nelson%20Gon%C3%A7alves%20-%20Revolta.mp3", nome: "Nelson Gonçalves - Revolta" },
            { url: "https://dn720903.ca.archive.org/0/items/50anosdeboemiavol1/19.%20Nelson%20Gon%C3%A7alves%20-%20Deusa%20do%20Asfalto.mp3", nome: "Nelson Gonçalves - Deusa do Asfalto" },
            { url: "https://dn720903.ca.archive.org/0/items/50anosdeboemiavol1/20.%20Nelson%20Gon%C3%A7alves%20-%20Carlos%20Gardel.mp3", nome: "Nelson Gonçalves - Carlos Gardel" },
            { url: "https://dn710206.ca.archive.org/0/items/orlando-silva-o-cantor-das-multidoes-gravacoes-originais-1935-1942-1995-3-cd-320-kbps/01%20-%20Orlando%20Silva%20-%20Carinhoso.mp3", nome: "Orlando Silva - Carinhoso" }
        ];

        let indiceAtual = 0;

        // Renderiza a lista automaticamente
        const listaDiv = document.getElementById('lista');
        tracks.forEach((track, i) => {
            const div = document.createElement('div');
            div.className = 'item';
            div.id = 'track-' + i;
            div.onclick = () => selecionar(i);
            div.innerHTML = `<span>${track.nome}</span>`;
            listaDiv.appendChild(div);
        });

        function selecionar(index) {
            indiceAtual = index;
            atualizarInterface();
            enviarParaOApp();
        }

        function atualizarInterface() {
            // Remove a classe active de todos
            document.querySelectorAll('.item').forEach(el => el.classList.remove('active'));
            // Adiciona na música atual
            const elementoAtivo = document.getElementById('track-' + indiceAtual);
            if (elementoAtivo) {
                elementoAtivo.classList.add('active');
                // Faz a lista rolar automaticamente para a música se ela estiver fora da visão
                elementoAtivo.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            }
        }

        function enviarParaOApp() {
            const musica = tracks[indiceAtual];
            if (window.parent) {
                window.parent.postMessage({
                    tipo: 'tocar',
                    url: musica.url,
                    nome: musica.nome
                }, '*');
            }
        }

        // Responde aos botões do App Principal
        window.addEventListener('message', function(event) {
            if (event.data === 'next') {
                indiceAtual = (indiceAtual + 1) % tracks.length;
                selecionar(indiceAtual);
            } else if (event.data === 'prev') {
                indiceAtual = (indiceAtual - 1 + tracks.length) % tracks.length;
                selecionar(indiceAtual);
            }
        });

        // Inicia a primeira música visualmente
        atualizarInterface();
    </script>
        <script>
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js');
    }
</script>
</body>
</html>
