<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <style>
        body { background: transparent; font-family: -apple-system, sans-serif; color: #084424; margin: 0; padding: 0; }
        #lista { display: flex; flex-direction: column; width: 100%; }
        
        .item { 
            padding: 16px 15px; 
            border-bottom: 1px solid rgba(8, 68, 36, 0.08); 
            cursor: pointer; 
            font-size: 16px; 
            font-weight: 400;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: all 0.2s ease;
            -webkit-tap-highlight-color: transparent;
        }

        /* Estilo para a música que está tocando */
        .item.active { 
            background-color: rgba(8, 68, 36, 0.05); 
            font-weight: 700;
            color: #084424;
            border-left: 4px solid #084424;
        }

        .item::after { content: "▶"; font-size: 10px; opacity: 0.3; margin-left: 10px; }
        .item.active::after { content: "🔊"; opacity: 1; font-size: 12px; }
        
        .item:active { background-color: rgba(8, 68, 36, 0.1); }
        
        .item span { 
            white-space: nowrap; 
            overflow: hidden; 
            text-overflow: ellipsis; 
            flex: 1;
        }
    </style>
</head>
<body> 
    <div id="lista">
        </div>

    <script>
        const tracks = [
            { url: "https://ia601005.us.archive.org/6/items/1958-tonico-e-tinoco-com-suas-modas-sertanejas/12%20-%20Tristeza%20do%20Jeca.mp3", nome: "Tonico e Tinoco - Tristeza do Jeca" },
            { url: "https://dn720703.ca.archive.org/0/items/1958-tonico-e-tinoco-com-suas-modas-sertanejas/10%20-%20Pe%20de%20Ipe.mp3", nome: "Tonico e Tinoco - Pé de Ipê" },
            { url: "https://dn720703.ca.archive.org/0/items/1958-tonico-e-tinoco-com-suas-modas-sertanejas/10%20-%20Pe%20de%20Ipe.mp3", nome: "Tonico e Tinoco - Eu e a Lua" },
            { url: "https://dn721904.ca.archive.org/0/items/1955-cascatinha-e-inhana-cantando-pra-voce/08%20-%20%C3%8Dndia.mp3", nome: "Cascatinha e Inhana - Índia" },
            { url: "https://ia601001.us.archive.org/15/items/1955-cascatinha-e-inhana-cantando-pra-voce/07%20-%20Recordando.mp3", nome: "Cascatinha e Inhana - Recordando" },
            { url: "https://ia601001.us.archive.org/15/items/1955-cascatinha-e-inhana-cantando-pra-voce/06%20-%20Assunci%C3%B3n.mp3", nome: "Cascatinha e Inhana - Assunción" },
            { url: "https://dn721904.ca.archive.org/0/items/1955-cascatinha-e-inhana-cantando-pra-voce/05%20-%20Desilus%C3%A3o.mp3", nome: "Cascatinha e Inhana - Desilusão" },
            { url: "https://dn721904.ca.archive.org/0/items/1955-cascatinha-e-inhana-cantando-pra-voce/04%20-%20Meu%20Primeiro%20Amor.mp3", nome: "Cascatinha e Inhana - Meu Primeiro Amor" },
            { url: "https://dn721904.ca.archive.org/0/items/1955-cascatinha-e-inhana-cantando-pra-voce/03%20-%20Iracema.mp3", nome: "Cascatinha e Inhana - Iracema" },
            { url: "https://dn721904.ca.archive.org/0/items/1955-cascatinha-e-inhana-cantando-pra-voce/02%20-%20Queira-me%20Muito.mp3", nome: "Cascatinha e Inhana - Queira-Me Muito" },
            { url: "https://dn721904.ca.archive.org/0/items/1955-cascatinha-e-inhana-cantando-pra-voce/01%20-%20Solid%C3%A3o%20%28Che-picassu-mi%29.mp3", nome: "Cascatinha e Inhana - Solidão" },
            { url: "https://dn720703.ca.archive.org/0/items/1958-tonico-e-tinoco-com-suas-modas-sertanejas/10%20-%20Pe%20de%20Ipe.mp3", nome: "Tonico e Tinoco - Saudades de Ouro Preto" },
            { url: "https://dn720703.ca.archive.org/0/items/1958-tonico-e-tinoco-com-suas-modas-sertanejas/10%20-%20Pe%20de%20Ipe.mp3", nome: "Tonico e Tinoco - Chico Mineiro" },
            { url: "https://dn720703.ca.archive.org/0/items/1958-tonico-e-tinoco-com-suas-modas-sertanejas/06%20-%20Aparecida%20do%20Norte.mp3", nome: "Tonico e Tinoco - Aparecida do Norte" },
            { url: "https://dn720703.ca.archive.org/0/items/1958-tonico-e-tinoco-com-suas-modas-sertanejas/05%20-%20Princesa.mp3", nome: "Tonico e Tinoco - Princesa" },

            { url: "https://dn720703.ca.archive.org/0/items/1958-tonico-e-tinoco-com-suas-modas-sertanejas/03%20-%20Rio%20Grande.mp3", nome: "Tonico e Tinoco - Rio Grande" },
            { url: "https://dn720703.ca.archive.org/0/items/1958-tonico-e-tinoco-com-suas-modas-sertanejas/02%20-%20Saudade%20de%20Matao.mp3", nome: "Tonico e Tinoco - Saudade de Matão" },
            { url: "https://dn720703.ca.archive.org/0/items/1958-tonico-e-tinoco-com-suas-modas-sertanejas/01%20-%20Cana%20Verde.mp3", nome: "Tonico e Tinoco - Cana Verde" },

            { url: "https://dn721509.ca.archive.org/0/items/1961-tiao-carreiro-e-pardinho-rei-do-gado/01-Alma%20de%20boemio.mp3", nome: "Tiâo Carreiro e Pardinho - Alma de Boêmio" },
            { url: "https://dn721509.ca.archive.org/0/items/1961-tiao-carreiro-e-pardinho-rei-do-gado/02-Borboleta%20do%20asfalto.mp3", nome: "Tiâo Carreiro e Pardinho - Borboleta do Asfalto" },
            { url: "https://dn721509.ca.archive.org/0/items/1961-tiao-carreiro-e-pardinho-rei-do-gado/03-Punhal%20da%20falsidade%20%28mulher%20sem%20nome%29.mp3", nome: "Tiâo Carreiro e Pardinho - Punhal da Falsidade" },
            { url: "https://dn721509.ca.archive.org/0/items/1961-tiao-carreiro-e-pardinho-rei-do-gado/04-Amigo%20sincero.mp3", nome: "Tiâo Carreiro e Pardinho - Amigo Sincero" },
            { url: "https://dn721509.ca.archive.org/0/items/1961-tiao-carreiro-e-pardinho-rei-do-gado/05-Teus%20beijos.mp3", nome: "Tiâo Carreiro e Pardinho - Teus Beijos" },
            { url: "https://dn721509.ca.archive.org/0/items/1961-tiao-carreiro-e-pardinho-rei-do-gado/06-Despedida.mp3", nome: "Tiâo Carreiro e Pardinho - Despedida" },
            { url: "https://dn721509.ca.archive.org/0/items/1961-tiao-carreiro-e-pardinho-rei-do-gado/07-Tormento.mp3", nome: "Tiâo Carreiro e Pardinho - Tormento" },
            { url: "https://dn721509.ca.archive.org/0/items/1961-tiao-carreiro-e-pardinho-rei-do-gado/08-Nove%20e%20nove.mp3", nome: "Tiâo Carreiro e Pardinho - Nove e Nove" },
            { url: "https://dn721509.ca.archive.org/0/items/1961-tiao-carreiro-e-pardinho-rei-do-gado/09-Rei%20do%20gado.mp3", nome: "Tiâo Carreiro e Pardinho - Rei do Gado" },
            { url: "https://dn721509.ca.archive.org/0/items/1961-tiao-carreiro-e-pardinho-rei-do-gado/10-Urutu%20cruzeiro.mp3", nome: "Tiâo Carreiro e Pardinho - Urutú Cruzeiro" },
            { url: "https://dn721509.ca.archive.org/0/items/1961-tiao-carreiro-e-pardinho-rei-do-gado/11-Minas%20Gerais.mp3", nome: "Tiâo Carreiro e Pardinho - Minas Gerais" },
            { url: "https://dn721509.ca.archive.org/0/items/1961-tiao-carreiro-e-pardinho-rei-do-gado/12-Carteiro.mp3", nome: "Tiâo Carreiro e Pardinho - Carteiro" },
            { url: "https://dn721509.ca.archive.org/0/items/1961-tiao-carreiro-e-pardinho-rei-do-gado/13-Pagode%20em%20Brasilia.mp3", nome: "Tiâo Carreiro e Pardinho - Pagode em Brasília" },
            { url: "https://dn721509.ca.archive.org/0/items/1961-tiao-carreiro-e-pardinho-rei-do-gado/14-Maria%20ciumenta.mp3", nome: "Tiâo Carreiro e Pardinho - Maria Ciumenta" }
        ];

        let indiceAtual = 0;

        // Renderiza a lista automaticamente
        const listaDiv = document.getElementById('lista');
        tracks.forEach((track, i) => {
            const div = document.createElement('div');
            div.className = 'item';
            div.id = 'track-' + i;
            div.onclick = () => selecionar(i);
            div.innerHTML = `<span>${track.nome}</span>`;
            listaDiv.appendChild(div);
        });

        function selecionar(index) {
            indiceAtual = index;
            atualizarInterface();
            enviarParaOApp();
        }

        function atualizarInterface() {
            // Remove a classe active de todos
            document.querySelectorAll('.item').forEach(el => el.classList.remove('active'));
            // Adiciona na música atual
            const elementoAtivo = document.getElementById('track-' + indiceAtual);
            if (elementoAtivo) {
                elementoAtivo.classList.add('active');
                // Faz a lista rolar automaticamente para a música se ela estiver fora da visão
                elementoAtivo.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            }
        }

        function enviarParaOApp() {
            const musica = tracks[indiceAtual];
            if (window.parent) {
                window.parent.postMessage({
                    tipo: 'tocar',
                    url: musica.url,
                    nome: musica.nome
                }, '*');
            }
        }

        // Responde aos botões do App Principal
        window.addEventListener('message', function(event) {
            if (event.data === 'next') {
                indiceAtual = (indiceAtual + 1) % tracks.length;
                selecionar(indiceAtual);
            } else if (event.data === 'prev') {
                indiceAtual = (indiceAtual - 1 + tracks.length) % tracks.length;
                selecionar(indiceAtual);
            }
        });

        // Inicia a primeira música visualmente
        atualizarInterface();
    </script>
        <script>
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js');
    }
</script>
</body>
</html>
